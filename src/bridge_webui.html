<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>duskfox · QQ 连接器</title>
<style>
:root{color-scheme:dark;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:#101218;color:#f1f1f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0%,#302c43 0,transparent 34%),#101218}
main{width:min(760px,calc(100% - 32px));margin:clamp(32px,9vh,96px) auto 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#e4b78d;color:#1a1719;font-weight:800;font-size:24px}
h1{font-size:27px;letter-spacing:-.04em;line-height:1.1;margin:0}header p{margin:3px 0 0;color:#a6a7ae;font-size:13px}
.card{background:#1c1e26;border:1px solid #353740;border-radius:18px;padding:clamp(22px,5vw,34px);box-shadow:0 20px 50px #0003}
h2{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}.muted{color:#a6a7ae;margin:0 0 24px}
label{display:block;color:#d4d3d6;font-size:13px;font-weight:650;margin-bottom:8px}.field{display:flex;gap:10px}
input,button{font:inherit;border-radius:10px;min-height:43px}input{min-width:0;flex:1;border:1px solid #454752;background:#14161c;color:#fff;padding:10px 13px;outline:none}input:focus{border-color:#e4b78d;box-shadow:0 0 0 3px #e4b78d24}
button{border:0;background:#e4b78d;color:#1d1a19;font-weight:700;padding:9px 18px;cursor:pointer}button:hover{background:#f1c9a4}button:disabled{opacity:.5;cursor:not-allowed}
.status{display:flex;align-items:center;gap:9px;padding:12px 14px;border:1px solid #353740;border-radius:10px;background:#15171e}.dot{width:8px;height:8px;background:#e4b78d;border-radius:50%;box-shadow:0 0 0 4px #e4b78d20}
.grid{display:grid;grid-template-columns:1fr auto;gap:28px;margin-top:23px}.kicker{color:#a6a7ae;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px}.value{font-weight:650;margin:0 0 18px}
.qr-box{width:224px;min-height:224px;display:grid;place-items:center;border:1px dashed #494b55;border-radius:14px;background:#15171e;color:#858690;text-align:center;padding:12px}#qr{width:198px;height:198px;object-fit:contain;display:none;background:#fff;border-radius:7px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}a{color:#e4b78d;text-decoration:none;font-weight:650}a:hover{text-decoration:underline}.note{border-top:1px solid #353740;margin:25px 0 0;padding-top:17px;color:#898b95;font-size:12px}
#error,#login-error{color:#ee9797}#login-error:empty,#error:empty{display:none}
@media(max-width:580px){.grid{grid-template-columns:1fr}.field{flex-direction:column}.qr-box{width:100%}}
</style>
<main>
<header><div class="mark" aria-hidden="true">d</div><div><h1>duskfox</h1><p>QQ 连接器 · 实验预览</p></div></header>
<section class="card" id="login"><h2>打开管理面板</h2><p class="muted">输入此实例的本地管理令牌。</p><label for="token">管理令牌</label><div class="field"><input id="token" type="password" autocomplete="off" placeholder="admin.token"><button id="unlock">进入</button></div><p id="login-error" role="alert"></p></section>
<section class="card" id="dashboard" hidden><h2>连接状态</h2><p class="muted">扫码由官方 QQ 完成；这里显示同一会话的状态。</p><div class="status"><span class="dot" aria-hidden="true"></span><strong id="phase">连接中</strong></div><p id="error" role="alert"></p><div class="grid"><div><p class="kicker">原生消息服务</p><p class="value" id="message">等待登录</p><p class="kicker">登录</p><p class="muted">如果右侧出现二维码，可直接用测试号扫码；没有二维码时打开原版 QQ 窗口。</p><div class="actions"><button id="refresh">刷新二维码</button><a id="official-login" href="http://127.0.0.1:16081/vnc.html" target="_blank" rel="noopener">打开原版 QQ 窗口 ↗</a></div></div><div class="qr-box"><img id="qr" alt="QQ 登录二维码"><span id="qr-empty">等待二维码</span></div></div><p class="note">此页面不保存二维码或聊天记录。OneBot 收发仍处于验证阶段。</p></section>
</main>
<script>
'use strict';
let adminToken=sessionStorage.getItem('qqNativeAdmin')||'';
const $=(id)=>document.getElementById(id);
async function api(route,method='GET'){
  const response=await fetch(route,{method,headers:{Authorization:`Bearer ${adminToken}`},cache:'no-store'});
  const value=await response.json();
  if(!response.ok)throw new Error(value.error||`HTTP ${response.status}`);
  return value;
}
async function update(){
  if(!adminToken)return;
  try{
    const status=await api('/api/status');
    $('login').hidden=true;$('dashboard').hidden=false;
    $('phase').textContent=status.phase;
    $('error').textContent=status.error||'';
    $('message').textContent=status.message_ready?'已就绪':'等待登录';
    $('refresh').hidden=status.login_mode==='passive';
    if(status.qr_ready){
      const qr=await api('/api/qr');
      $('qr').src=qr.image;$('qr').style.display='block';$('qr-empty').hidden=true;
    }else{$('qr').removeAttribute('src');$('qr').style.display='none';$('qr-empty').hidden=false;}
  }catch(error){$('login-error').textContent=error.message;$('error').textContent=error.message;}
}
$('unlock').onclick=async()=>{adminToken=$('token').value.trim();try{await api('/api/status');sessionStorage.setItem('qqNativeAdmin',adminToken);$('login-error').textContent='';await update();}catch(error){$('login-error').textContent=error.message;}};
$('refresh').onclick=async()=>{try{await api('/api/qr/refresh','POST');await update();}catch(error){$('error').textContent=error.message;}};
setInterval(update,2500);update();
</script>
</html>
