:root{--ink:#0d0d0d;--paper:#fff;--hair:#e2e2e2;--muted:#6d6d6d;--soft:#f5f4f2;--accent:#df7f43;--on-accent:#0d0d0d;--ok:#0d0d0d;--dur:.2s;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
[data-theme=dark]{--ink:#f1efec;--paper:#0e0e0e;--hair:#262626;--muted:#8d8d8d;--soft:#161616;color-scheme:dark}
[data-motion=off] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box;border-radius:0;box-shadow:none;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.65 Inter,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
[data-density=tight] body{font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;-webkit-appearance:none;appearance:none}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--accent);color:#0d0d0d}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-size:.86em}
.muted{color:var(--muted)}
.hidden{display:none!important}
/* 登录 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.lg{width:100%;max-width:416px;text-align:center;animation:rise .5s var(--ease) both}
.wm{font-family:Grotesk,Inter,sans-serif;font-size:clamp(64px,16vw,96px);line-height:1;letter-spacing:-.045em;font-weight:700}
.lg .sub{color:var(--muted);font-size:13px;margin-top:20px}
.lg hr{border:0;border-top:1px solid var(--ink);margin:56px 0 40px}
.lg h1{font-size:13px;font-weight:700}
.lg p{color:var(--muted);font-size:14px;margin-top:14px}
.lg label{display:block;font-size:11px;color:var(--muted);margin-top:48px}
.lg input{width:100%;text-align:center;font-size:17px;padding:12px 0;border-bottom:1.5px solid var(--ink);transition:border-color var(--dur)}
.lg input::placeholder{color:var(--muted);opacity:.8}
.lg input:focus{border-color:var(--accent)}

/* ---- HTTP ---- */
async function api(method,path,body){
  var opts={method:method,headers:{accept:'application/json'}},t=tok();
  if(t)opts.headers.authorization='Bearer '+t;
  if(body!==undefined){opts.headers['content-type']='application/json';opts.body=JSON.stringify(body)}
  var res;
  try{res=await fetch(path,opts)}catch(err){throw {network:true,message:'无法连接服务端：'+((err&&err.message)||err)}}
  var data=null;try{data=await res.json()}catch(e){data=null}
  if(res.status===401){unauth();throw {unauthorized:true,message:'未登录'}}
  if(!res.ok)throw {status:res.status,message:((data&&(data.error||data.message))||('HTTP '+res.status))};
  return data;
}

function loginLabel(a){

  if(a.loginType==='qr')return '扫码登录';
  if(a.loginType==='quick')return '快速登录';
  if(a.loginType==='password')return '密码登录';
  if(a.loginType==='session')return '已有会话';
  return a.online?'在线':a.state==='logging'?'已授权':'未登录';
}
function applyStatus(d){
  if(!d)return;
  S.app=d.app||{};S.paths=d.paths||{};

/* ---- 订阅推送 ---- */
function pushEv(e){
  if(!e)return;
  var item={t:e.type||e.t,s:e.summary||e.s,time:e.time||clock()};
  EV.unshift(item);if(EV.length>200)EV.pop();
  DF.signal.push(1);
  subs.forEach(function(f){try{f('ev',item)}catch(x){}});
}
function pushLg(r){
  if(!r)return;
  var item={time:r.time||clock(),l:r.level||r.l||'INFO',mod:r.module||r.mod||'app',m:r.msg||r.m||''};
  LG.push(item);if(LG.length>400)LG.shift();
  subs.forEach(function(f){try{f('lg',item)}catch(x){}});
}

var ES=null,esTimer=null,esDelay=1000,esActive=false;
async function connectStream(){
  if(ES){try{ES.close()}catch(e){}ES=null}
  if(!window.EventSource)return;
  var ticket='';
  try{var tk=await api('POST','/api/tickets',{purpose:'stream'});ticket=tk.ticket||''}catch(e){return}
  if(!ticket)return;
  try{ES=new EventSource('/api/stream?ticket='+encodeURIComponent(ticket))}catch(e){return}
  ES.addEventListener('log',function(ev){try{pushLg(JSON.parse(ev.data))}catch(e){}});
  ES.addEventListener('event',function(ev){try{pushEv(JSON.parse(ev.data))}catch(e){}});
  ES.addEventListener('status',function(ev){try{var st=JSON.parse(ev.data);if(st&&cur==='account')updateAccountLive(st)}catch(e){}});
  ES.addEventListener('qr',function(ev){try{S.qr=JSON.parse(ev.data);if(cur==='account')paintQr()}catch(e){}});
  ES.addEventListener('config',function(){loadConfig().then(function(){if(cur==='network'&&P.network.draw)P.network.draw();if(cur==='onebot')render()}).catch(function(){})});
  ES.onopen=function(){esActive=true;esDelay=1000};
  ES.onerror=function(){esActive=false;if(ES){try{ES.close()}catch(e){}ES=null}clearTimeout(esTimer);esTimer=setTimeout(connectStream,esDelay);esDelay=Math.min(esDelay*2,15000)};
}

function qrModeLabel(q){
 if(!q||!q.loginMode||q.loginMode==='unknown')return '';

}
function qrHintText(q){
 if(!q)return '尚未获取到二维码。';
 if(q.hint)return E(q.hint);
 switch(q.state){
  case 'waiting':return (q.mock?'<b>模拟驱动</b>：二维码不可扫描，仅用于界面联调。':'二维码由当前驱动生成。')+'<br>剩余 <b id="ql">—</b> 秒';
  case 'scanned':return '已扫码，请在手机上确认登录。';
  case 'confirmed':return '登录成功，正在初始化会话…';
  case 'expired':return '二维码已过期。';
  case 'none':return S.acct.online?'账号已在线，没有待扫描的二维码。':'当前没有待扫描的二维码。';
  default:return '暂时没有可扫描的二维码。';
 }

function paintQr(){
 var img=$('#qri'),hint=$('#qrhint'),box=$('#qr'),btn=$('#qrf'),mode=$('#qrmode');
 if(!img)return;
 var q=S.qr||{state:'none'};
 if(q.image&&q.state==='waiting'){
  img.src=q.image;img.style.display='block';if(box)box.classList.remove('ex');
 }else{
  img.removeAttribute('src');img.style.display='none';
  if(box)box.classList.toggle('ex',q.state==='expired'||q.state==='scanned'||q.state==='confirmed'||(q.state==='none'&&!q.image));
 }
 if(hint)hint.innerHTML=qrHintText(q);
 if(btn){
  var canRefresh=q.refreshable!==false;
  btn.disabled=!canRefresh;
  btn.style.opacity=canRefresh?'1':'.45';
  btn.title=canRefresh?'':'该运行时无法主动刷新二维码';
 }
 if(mode)mode.textContent=qrModeLabel(q);
 updateQrCountdown();
}

 var art=$('svg',el),carriage=$('.geo-carriage',el),label=$('.geo-label',el),hint=$('.geo-hint',el),ticks=$$('.geo-stop',el);
 var current=ORDER.indexOf(cur),preview=current,position=current,target=current,velocity=0;
 var pointer=null,originX=0,originY=0,originIndex=current,step=24,moved=false;
 var frame=0,lastTime=0,pending=null,disposed=false,detentTimer=0;
 var motionQuery=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
 function reduced(){return SET.motion==='off'||(motionQuery&&motionQuery.matches)}
 function clamp(n){return Math.max(0,Math.min(8,n))}
 function rubber(n){var edge=clamp(n),over=n-edge;return edge+over*.24/(1+Math.abs(over)*.65)}
 function paint(){carriage.setAttribute('transform','translate('+(34+position*24).toFixed(3)+' 0)')}
 function select(n){
  n=clamp(n);var changed=n!==preview;preview=n;
  label.textContent=pad(n+1)+' · '+P[ORDER[n]].n;
  el.setAttribute('aria-valuenow',n+1);el.setAttribute('aria-valuetext',pad(n+1)+' '+P[ORDER[n]].n);
  ticks.forEach(function(t,j){t.classList.toggle('is-on',j===n)});
  $$('#nav a').forEach(function(a,j){a.classList.toggle('is-preview',j===n&&n!==current)});
  if(changed&&!reduced()){
   clearTimeout(detentTimer);el.classList.add('is-detent');
   detentTimer=setTimeout(function(){el.classList.remove('is-detent')},90);
  }
 }
 function commit(){
  if(pending===null||disposed)return;
  var n=pending;pending=null;el.classList.remove('is-settling');hint.textContent='左右拖动 · 松手切页';
  if(n===current)return;
  geoFocusAfterRoute=document.activeElement===el;
  location.hash='#/'+ORDER[n];
 }
 function animate(t){
  frame=0;if(disposed)return;
  // 时间步进的弹簧：拉动时跟手，松开后在格点短暂回弹并收稳。
  var dt=lastTime?Math.min((t-lastTime)/1000,.032):1/60;lastTime=t;
  var stiffness=pointer!==null?420:310,damping=pointer!==null?34:27;
  var steps=Math.max(1,Math.ceil(dt/.008)),h=dt/steps;
  for(var j=0;j<steps;j++){velocity+=((target-position)*stiffness-velocity*damping)*h;position+=velocity*h}
  paint();
  if(Math.abs(target-position)<.0015&&Math.abs(velocity)<.015){position=target;velocity=0;lastTime=0;paint();commit()}
  else frame=requestAnimationFrame(animate);
 }
 function aim(n){
  target=n;
  if(reduced()){if(frame)cancelAnimationFrame(frame);frame=0;lastTime=0;position=n;velocity=0;paint();commit()}
  else if(!frame){lastTime=0;frame=requestAnimationFrame(animate)}
 }
 function endCapture(){
  var id=pointer;pointer=null;el.classList.remove('is-dragging');document.body.classList.remove('geo-dragging');
  if(id!==null&&el.hasPointerCapture(id))el.releasePointerCapture(id);
 }
 function down(e){
  if(pointer!==null||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
  pending=null;el.classList.remove('is-settling');pointer=e.pointerId;
  originX=e.clientX;originY=e.clientY;originIndex=preview;
  // 一格至少 22px，窄屏也能稳定选择，整条装饰均可抓取。
  step=Math.max(22,art.getBoundingClientRect().width*24/260);moved=false;
  el.focus({preventScroll:true});el.setPointerCapture(pointer);
  el.classList.add('is-dragging');document.body.classList.add('geo-dragging');
  hint.textContent='逐格选择 · 松手确认';
 }
 function move(e){
  if(e.pointerId!==pointer)return;
  var dx=e.clientX-originX,dy=e.clientY-originY;
  if(!moved&&Math.max(Math.abs(dx),Math.abs(dy))<4)return;
  if(!moved&&Math.abs(dy)>Math.abs(dx)*1.35){cancel();return}
  moved=true;if(e.cancelable)e.preventDefault();
  var raw=originIndex+dx/step,next=preview;
  // 0.58 格的换挡阈值与回差，避免手停在格线附近反复跳动。
  while(raw>next+.58&&next<8)next++;
  while(raw<next-.58&&next>0)next--;
  select(next);
  var bounded=rubber(raw),pull=bounded-preview;
  aim(raw<0||raw>8?bounded:preview+pull*.34);
 }
 function up(e){
  if(e.pointerId!==pointer)return;
  move(e);if(pointer===null)return;
  endCapture();pending=preview;el.classList.add('is-settling');hint.textContent='吸附中';aim(preview);
 }
 function cancel(){
  if(pointer===null&&pending===null)return;
  pending=null;endCapture();el.classList.remove('is-settling');select(current);
  hint.textContent='左右拖动 · 松手切页';aim(current);
 }
 function lost(e){if(e.pointerId===pointer)cancel()}
 function key(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Escape'){e.preventDefault();cancel();return}
  var n=preview;
  if(e.key==='ArrowRight'||e.key==='ArrowUp')n++;
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown')n--;
  else if(e.key==='Home')n=0;else if(e.key==='End')n=8;else return;
  e.preventDefault();endCapture();select(clamp(n));pending=preview;aim(preview);
 }
 function visibility(){if(document.hidden)cancel()}
 el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',cancel);
 el.addEventListener('lostpointercapture',lost);el.addEventListener('keydown',key);
 window.addEventListener('blur',cancel);window.addEventListener('resize',cancel);document.addEventListener('visibilitychange',visibility);
 if(geoFocusAfterRoute){el.focus({preventScroll:true});geoFocusAfterRoute=false}
 geoCleanup=function(){
  disposed=true;pending=null;endCapture();cancelAnimationFrame(frame);clearTimeout(detentTimer);
  $$('#nav a').forEach(function(a){a.classList.remove('is-preview')});
  el.removeEventListener('pointerdown',down);el.removeEventListener('pointermove',move);
  el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',cancel);
  el.removeEventListener('lostpointercapture',lost);el.removeEventListener('keydown',key);
  window.removeEventListener('blur',cancel);window.removeEventListener('resize',cancel);document.removeEventListener('visibilitychange',visibility);
  geoCleanup=null;
 };
}

function buildNav(){$('#nav').innerHTML=ORDER.map(function(k,i){return '<a href="#/'+k+'" data-k="'+k+'" style="--i:'+i+'"><i>'+pad(i+1)+'</i><span>'+P[k].n+'</span><em>'+k+'</em></a>'}).join('');syncThm()}
function syncThm(){$$('[data-th]').forEach(function(b){b.classList.toggle('on',b.dataset.th===SET.theme)})}
function toggleIx(){}
function closeIx(){toggleIx(false)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-th]');if(b){SET.theme=b.dataset.th;saveSet();syncThm();return}if(e.target.closest('[data-logout]')){var tk=tok();if(tk){fetch('/api/auth/logout',{method:'POST',headers:{authorization:'Bearer '+tk}}).catch(function(){})}try{sessionStorage.removeItem('df_token')}catch(x){}setTimeout(function(){location.reload()},60)}});
document.addEventListener('keydown',function(e){if($('#app').classList.contains('hidden'))return;var tg=e.target.tagName;if(e.key==='Escape'){closeIx();return}if(/INPUT|TEXTAREA|SELECT/.test(tg)||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='/'||e.key==='i'){e.preventDefault();toggleIx()}else if(/^[1-9]$/.test(e.key)){location.hash='#/'+ORDER[+e.key-1]}});
window.addEventListener('scroll',function(){document.body.classList.toggle('sc',scrollY>8)},{passive:true});
function render(){if(geoCleanup)geoCleanup();var k=(location.hash.replace('#/','').split('/')[0])||'overview';if(!P[k])k='overview';cur=k;
 timers.forEach(clearInterval);timers=[];unsub=null;$$('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.k===k)});closeIx();
 var m=$('#main'),ni=ORDER[(ORDER.indexOf(k)+1)%ORDER.length];m.innerHTML='<div class="pg">'+P[k].r()+'<a class="next" href="#/'+ni+'"><small>下一页 · '+pad(ORDER.indexOf(ni)+1)+'</small><span>'+P[ni].n+'</span><i>→</i></a></div>';$$('.pg .sec').forEach(function(e,i){e.style.setProperty('--s',i)});initGeoNav();if(P[k].i)P[k].i();drawAll();window.scrollTo(0,0);$('#cur').textContent=pad(ORDER.indexOf(k)+1)+' / '+P[k].n;var pl=$('#pl');pl.classList.remove('go');void pl.offsetWidth;pl.classList.add('go');document.title=P[k].n+' · duskfox'}
subs.push(function(k,e){if(unsub)unsub(k,e)});

/* ====== 交互：统一事件委托 ====== */
async function refreshStatus(){
 try{await loadStatus();S.err='';S.demo='normal';render();}catch(err){S.err=err&&err.message;S.demo='error';render()}
}
async function withBusy(btn,label,fn){
 var old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="spin"></i>'+(label||'处理中');
 try{await fn()}catch(err){toast('操作失败',(err&&err.message)||'')}finally{btn.disabled=false;btn.innerHTML=old}
}
document.addEventListener('click',function(e){
 var t=e.target;
 var pd=t.closest('[data-pend]');
 if(pd){var s=pd.dataset.pend.split(' ');pend(s[0],s.slice(1).join(' '));return}
 var sg=t.closest('[data-seg] button');
 if(sg){var key=sg.parentNode.dataset.seg,v=sg.dataset.v;SET[key]=isNaN(v)||v===''?v:+v;saveSet();$$('button',sg.parentNode).forEach(function(x){x.classList.toggle('on',x===sg)});return}
 var w=t.closest('.sw');
 if(w&&!w.disabled){
  var on=!w.classList.contains('on');w.classList.toggle('on',on);w.setAttribute('aria-checked',on);
  var id=w.dataset.sw;e.stopPropagation();
  if(id==='no1'||id==='no2'||id==='no3')return;
  if(id&&id.indexOf('evt_')===0){S.evt[id.slice(4)]=on;saveOnebot();return}
  if(id in SET){SET[id]=on;saveSet();return}
  if(S.ob&&id in S.ob){S.ob[id]=on;return}
  var en=/^en(\d+)$/.exec(id||'');
  if(en){var list=S.net[ntab];if(list&&list[+en[1]]){list[+en[1]].enabled=on;saveNetwork(true);return}}
  var m=/^([A-Za-z]+)(\d+)$/.exec(id||'');
  if(m&&S.net[ntab]&&S.net[ntab][+m[2]]){S.net[ntab][+m[2]][m[1]]=on;return}
  return;
 }
 var a=t.closest('[data-act]');if(!a)return;
 handleAct(a,e);
});
async function handleAct(a,e){
 var act=a.dataset.act;
 if(act==='retry'){return refreshStatus()}
 if(act==='refresh'){return refreshStatus()}
 if(act==='logout'){
  if(!confirm('确定退出当前账号？'))return;
  try{await api('POST','/api/account/logout');toast('已退出登录');await loadStatus();render()}catch(err){toast('退出失败',err.message||'')}
  return;
 }
 if(act==='ps'){var v=a.dataset.v;return withBusy(a,'处理中',async function(){await api('POST','/api/process/'+v);toast('已提交','POST /api/process/'+v);await loadProcess();render()})}
 if(act==='qrrefresh'){
  return withBusy(a,'刷新中',async function(){
   var d=await api('POST','/api/qr/refresh');S.qr=d;paintQr();
   if(d&&d.refreshable===false)toast('无法主动刷新',d.hint||'该运行时只能由 QQ 客户端窗口刷新二维码');
   else if(d&&d.image)toast('二维码已刷新');
   else toast('已请求刷新',(d&&d.hint)||'正在等待运行时返回二维码');
  });
 }
 if(act==='nopen'){nopen=nopen===a.dataset.id?null:a.dataset.id;P.network.draw();return}
 if(act==='nadd'){S.net[ntab].push(newConn());await saveNetwork(true);nopen=ntab+(S.net[ntab].length-1);P.network.draw();toast('已新增','尚未启用，保存后生效');return}
 if(act==='ndel'){
  var di=+a.dataset.i;S.net[ntab].splice(di,1);nopen=null;await saveNetwork();P.network.draw();return;
 }
 if(act==='nsave'){
  var i=+a.dataset.i,bd=a.closest('.bd'),c=S.net[ntab][i];if(!c)return;
  $$('[data-k]',bd).forEach(function(x){var k=x.dataset.k,val=x.value;if(k==='port'||k==='heartbeat'||k==='reconnect'||k==='timeout')val=val===''?0:+val;c[k]=val});
  await withBusy(a,'保存中',function(){return saveNetwork()});
  return;
 }
 if(act==='obsave'){return withBusy(a,'保存中',saveOnebot)}
 if(act==='token'){
  var f=$('#ntk');if(!f)return;
  var nv=f.value.trim();
  return withBusy(a,'更新中',async function(){var d=await api('PUT','/api/security/token',{token:nv});setTok(d.token);f.value='';toast('令牌已更新','旧令牌立即失效，当前会话继续有效')});
 }
 if(act==='pwlogin'){
  var u=$('#pwu'),p=$('#pwp');
  if(!u||!p)return;
  var uin=u.value.trim(),pw=p.value;
  if(!uin||!pw){toast('请填写 QQ 号与密码');return}
  return withBusy(a,'登录中',async function(){
   try{
    await api('POST','/api/account/login',{method:'password',uin:uin,password:pw});
    p.value='';
    toast('已提交密码登录','若触发设备验证，请按运行时提示操作');
    loadStatus().then(function(){if(cur==='account')render()}).catch(function(){});
   }catch(err){toast('登录失败',(err&&err.message)||'')}
  });
 }
 if(act==='logdl'){
  return withBusy(a,'准备中',async function(){
   var t=await api('POST','/api/tickets',{purpose:'logs.download'});
   location.href='/api/logs/download?ticket='+encodeURIComponent(t.ticket);
  });
 }
 if(act==='exportcfg'){
  return withBusy(a,'准备中',async function(){
   var t=await api('POST','/api/tickets',{purpose:'config.export'});
   location.href='/api/config/export?ticket='+encodeURIComponent(t.ticket);
  });
 }
 if(act==='clean'){
  var tv=a.dataset.v;
  return withBusy(a,'清理中',async function(){var d=await api('POST','/api/storage/clean?target='+tv);toast('已清理',(d.removedFiles||0)+' 个文件 · '+fmtSize(d.freedBytes||0));render()});
 }
 if(act==='instance_restart'){
  return withBusy(a,'重启中',async function(){await api('POST','/api/instance/restart');toast('实例已重启','网络与驱动已重载');await loadAll();render()});
 }
 if(act==='resetcfg'){
  if(!confirm('恢复默认将覆盖 OneBot 与网络配置，确定继续？'))return;
  return withBusy(a,'恢复中',async function(){await api('POST','/api/config/reset?to=all');await loadConfig();toast('已恢复默认配置');render()});
 }
 if(act==='importcfg'){
  var input=document.createElement('input');input.type='file';input.accept='application/json,.json';
  input.onchange=function(){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();
   reader.onload=function(){var data;try{data=JSON.parse(String(reader.result))}catch(err){toast('导入失败','文件不是合法 JSON');return}
    api('POST','/api/config/import',{config:data}).then(async function(d){await loadConfig();toast('已导入',(d.sections||[]).join('、'));render()}).catch(function(err){toast('导入失败',err.message||'')});
   };reader.readAsText(file)};
  input.click();return;
 }
 if(act==='fdir'){P.files.load(a.dataset.p);return}
 if(act==='fopen'){
  var fi=FS_ENTRIES[+a.dataset.i];if(!fi)return;
  if(fi.type==='dir'){P.files.load((S.cwd==='/'?'':S.cwd)+'/'+fi.name);return}
  S.sel=fi.name;
  $$('.fi').forEach(function(x){x.classList.toggle('sel',x.dataset.i===a.dataset.i)});
  P.files.preview(fi.name);return;
 }
}

window.addEventListener('hashchange',render);

/* ====== 登录 ====== */
function enter(fast){
 var lg=$('#login'),go=function(){
  lg.classList.add('hidden');
  var a=$('#app');a.classList.remove('hidden');a.classList.add('in');
  var av=$('#avs');if(av&&S.acct.avatar)av.src=S.acct.avatar;
  var rn=$('#railname');if(rn)rn.textContent=S.acct.nick||'duskfox';
  var ri=$('#railinfo');if(ri)ri.textContent=(S.acct.online?S.acct.uin+' · 已连接':'未登录');
  buildNav();render();connectStream();
 };
 if(fast){go();return}
 lg.classList.add('leave');setTimeout(go,520);
}
$('#lgf').onsubmit=function(e){
 e.preventDefault();
 var v=$('#tk').value.trim(),b=$('#lgb'),er=$('#lge'),f=this;
 er.textContent='';
 if(!v){er.textContent='请输入管理令牌';return}
 b.disabled=true;b.innerHTML='<i class="spin"></i>验证中';
 api('POST','/api/auth/login',{token:v}).then(function(d){
  setTok(d.token);return loadAll();
 }).then(function(){
  b.disabled=false;b.innerHTML='进入控制台';enter();
 }).catch(function(err){
  b.disabled=false;b.textContent='进入控制台';
  er.textContent=(err&&err.message)||'令牌不正确，请重试';
  f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
 });
};
var hasToken=!!tok();
var wm=$('.wm');
if(wm){
 wm.setAttribute('aria-label','duskfox');
 wm.innerHTML=wm.textContent.split('').map(function(ch,i){return '<span aria-hidden="true" style="--c:'+i+'">'+ch+'</span>'}).join('');
}
$$('.lg>*').forEach(function(el,i){el.style.setProperty('--n',i)});
var entered=false;
if(hasToken)$('#login').classList.add('hidden');
function start(){
 if(!hasToken){$('#tk').focus({preventScroll:true});return}
 if(entered)return;
 entered=true;
 loadAll().then(function(){enter(true)}).catch(function(err){
  if(err&&err.unauthorized)return;
  entered=false;hasToken=false;setTok('');
  $('#login').classList.remove('hidden');$('#app').classList.add('hidden');
  toast('无法连接服务端',(err&&err.message)||'请确认实例正在运行');
  $('#tk').focus({preventScroll:true});
 });
}
var boot=$('#boot'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!boot||reduce||SET.motion==='off'){if(boot)boot.remove();document.documentElement.classList.remove('boot');start()}
else{
 document.documentElement.classList.add('boot');window.__splashReady=false;
 setTimeout(function(){window.__splashReady=true},300);
 var lifted=false;(function w(){
  var b=document.getElementById('boot');
  if(!b){document.documentElement.classList.remove('boot');start();return}
  requestAnimationFrame(w)
 })();
 var skip=function(){var b=document.getElementById('boot');if(b)b.remove()};
 addEventListener('pointerdown',skip,{once:true});addEventListener('keydown',skip,{once:true})
}
})();
